name: Publish lector

# Trusted publishing (OIDC): no long-lived npm tokens after the first release.
# npm CLI detects the OIDC environment automatically (requires npm >= 11.5.1).
#
# npm's trusted-publisher settings live on the PACKAGE's own settings page
# (npmjs.com/package/@danypops/lector/access), which does not exist until the
# package has been published at least once -- so for a brand-new package name,
# the sequence is: (1) one manual `npm publish` from a machine logged into npm
# (this workflow cannot do that part -- it has no npm token, by design), then
# (2) configure the trusted publisher: org=DanyPops repo=lector
# workflow=publish.yml, then (3) this workflow handles every release after
# that via OIDC, triggered by a `lector-v*` tag push.
#
# Tag scheme is per-package (`lector-v*`, and `pi-lector-v*` once that package
# is ready to publish too), not a bare `v*` -- this is a monorepo with two
# independently versioned packages, and a shared tag prefix would leave which
# package a release actually refers to ambiguous.

on:
  push:
    tags:
      - "lector-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # Installed once from the repo root -- this is what actually links
      # packages/pi-lector's @danypops/lector dependency to packages/lector
      # via the workspace, not a separate registry fetch.
      - run: bun install
      - run: bun test
        working-directory: packages/lector
      - run: bun x tsc --noEmit
        working-directory: packages/lector

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      # Idempotent: a re-run of the same tag (e.g. a retried workflow) must not
      # fail loudly trying to republish a version that already succeeded.
      - id: registry
        working-directory: packages/lector
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --provenance explicitly, even though npm's docs say OIDC publishes generate it
      # automatically -- real-world reports (multiple independent accounts) found it did not
      # happen reliably without the flag on at least the first OIDC-authenticated publish.
      - if: steps.registry.outputs.published != 'true'
        working-directory: packages/lector
        run: npm publish --access public --provenance
