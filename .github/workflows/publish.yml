name: Publish packages

on:
  push:
    tags:
      - "lector-v*"
      - "pi-lector-v*"
      - "zodiac-lector-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - id: package
        name: Match tag to package version
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            lector-v*)
              package_dir="packages/lector"
              tag_version="${GITHUB_REF_NAME#lector-v}"
              ;;
            pi-lector-v*)
              package_dir="packages/pi-lector"
              tag_version="${GITHUB_REF_NAME#pi-lector-v}"
              ;;
            zodiac-lector-v*)
              package_dir="packages/zodiac-lector"
              tag_version="${GITHUB_REF_NAME#zodiac-lector-v}"
              ;;
            *)
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          package_version="$(node -p "require('./$package_dir/package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match $package_dir version $package_version" >&2
            exit 1
          fi
          echo "dir=$package_dir" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install system test dependencies
        # A short per-step timeout plus apt's own retries fails fast and clearly on a slow/broken
        # mirror instead of silently consuming the whole job's 20-minute budget with no indication
        # of which step or why.
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install --yes -o Acquire::Retries=3 clangd ripgrep
          rustup component add rust-analyzer
          go install golang.org/x/tools/gopls@v0.23.0
          go install github.com/sourcegraph/zoekt/cmd/zoekt-index@latest
          go install github.com/sourcegraph/zoekt/cmd/zoekt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # bash-language-server resolves by bare name against PATH (see language-server-descriptor.ts):
          # its own pinned editorconfig dependency carries an unpatched ReDoS/OOM chain, so it is a
          # self-installed system binary rather than a bundled npm dependency.
          bun add --global bash-language-server

      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Scoped to the tagged package's own directory, not every workspace
      # package -- a release tag proves that one package's own suite, not
      # the whole monorepo's ever-growing aggregate one, fits comfortably
      # inside this job's fixed timeout-minutes budget. zodiac-lector-v0.0.7's
      # own publish run hit exactly this timeout mid-suite and never
      # published as a direct result of the unscoped '*' filter.
      - working-directory: ${{ steps.package.outputs.dir }}
        run: bun run typecheck
      - working-directory: ${{ steps.package.outputs.dir }}
        run: bun run test

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm install -g npm@latest && npm --version

      - id: registry
        working-directory: ${{ steps.package.outputs.dir }}
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published != 'true'
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm publish --access public --provenance
